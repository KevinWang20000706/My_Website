<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>沖繩五日遊行程表 (11/14 - 11/18)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  body {
    font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
    background-color: #faf6f2;
    margin: 0;
    padding: 20px;
    color: #333;
  }

  .page {
    width: 210mm;
    min-height: 285mm;
    margin: 0 auto 20px auto;
    background: #ffffff;
    padding: 12mm 15mm;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    border-radius: 8px;
    position: relative;
    page-break-after: always;
  }

  .page:last-child {
    page-break-after: auto;
  }

  @media print {
    body {
      background: #fff;
      padding: 0;
    }
    .page {
      width: 100%;
      min-height: auto;
      margin: 0;
      padding: 8mm 10mm;
      box-shadow: none;
      page-break-after: always;
    }
    .no-print {
      display: none !important;
    }
  }

  .day-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
  }

  /* 活潑飽滿的珊瑚粉紅膠囊 */
  .day-badge {
    background-color: #ff5c8a;
    color: white;
    font-weight: 700;
    font-size: 17px;
    padding: 5px 18px;
    border-radius: 25px;
    margin-right: 14px;
    box-shadow: 0 2px 6px rgba(255, 92, 138, 0.3);
  }

  /* 莓果深紅標題 */
  .day-title {
    color: #d81b60;
    font-weight: 700;
    font-size: 18.5px;
    letter-spacing: 0.5px;
  }

  /* 現代無邊框表格：拿掉左右邊邊與直線 */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: none;
  }

  /* 濃郁飽滿的暖陽金黃表頭 */
  th {
    background-color: #ffca4b;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 8px;
    text-align: center;
    vertical-align: middle;
    border: none;
    border-bottom: 2.5px solid #f08c00;
  }

  th.col-time { width: 18%; color: #c94a1a; }
  th.col-act  { width: 58%; color: #00796b; }
  th.col-note { width: 24%; color: #5e35b1; }

  td {
    border: none; /* 移除左右外框與垂直格線 */
    padding: 2px 8px;
    font-size: 13.5px;
    text-align: center;
    vertical-align: middle;
    height: 22px;
  }

  /* 以「行程」為單位整排同色：白底 vs 蜜桃奶油底 (加深對比度) */
  .event-white {
    background-color: #ffffff;
  }
  .event-tinted {
    background-color: #fff3eb; /* 溫暖明顯的蜜桃奶油色條紋 */
  }

  /* 同一個行程內部每30分鐘的微分隔線 (極淡，不破壞整排同色感) */
  td.time-inner-border {
    border-bottom: 1px dashed rgba(230, 160, 125, 0.35);
  }

  /* 不同行程之間的明確水平分隔線 */
  td.event-bottom-border {
    border-bottom: 1.5px solid #f4ccb6;
  }

  /* 時間欄文字：暖磚橘色粗體 */
  td.time-cell {
    color: #d85a2b;
    font-weight: 700;
    font-size: 12px;
    padding: 1px 4px;
    white-space: nowrap;
  }

  /* 行程欄文字：統一松石深青綠粗體字 */
  td.act-cell {
    color: #00796b;
    font-weight: 700;
    line-height: 1.35;
  }

  .map-link {
    display: inline-block;
    text-decoration: none;
    color: #673ab7;
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.15s ease;
  }

  .map-link:hover {
    transform: scale(1.15);
  }

  .toolbar {
    text-align: center;
    margin-bottom: 20px;
  }

  .print-btn {
    background-color: #ff5c8a;
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(255, 92, 138, 0.3);
  }
  .print-btn:hover {
    background-color: #e64978;
  }
</style>
</head>

// 將沖繩當地時間 (JST, UTC+9) 轉換為精確的 Epoch 秒數
function getJstEpoch(year, month, day, hour, minute) {
  return Math.floor(Date.UTC(year, month - 1, day, hour - 9, minute, 0) / 1000);
}

// 產生帶有「指定當天該時段出發 (!6e0!7e2!8j...)」與「開車(!3e0) / 步行(!3e2) / 大眾運輸公車(!3e3)」的 Google Maps 路線網址
function makeMapUrl(orig, dest, month, day, hour, minute, mode = 'drive') {
  const epoch = getJstEpoch(2026, month, day, hour, minute);
  let modeParam = '!3e0';
  if (mode === 'walk') modeParam = '!3e2';
  if (mode === 'transit') modeParam = '!3e3';
  return `https://www.google.com/maps/dir/${encodeURIComponent(orig)}/${encodeURIComponent(dest)}/data=!4m6!4m5!2m3!6e0!7e2!8j${epoch}${modeParam}`;
}

    slots: [
      "10:00 - 10:30", "10:30 - 11:00", "11:00 - 11:30", "11:30 - 12:00", "12:00 - 12:30",

const app = document.getElementById('app');

daysData.forEach(dayObj => {
  const page = document.createElement('div');
  page.className = 'page';

  // Header
  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `
    <div class="day-badge">${dayObj.day}</div>
    <div class="day-title">${dayObj.title}</div>
  `;
  page.appendChild(header);

  // Table
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th class="col-time">⏰ 時間</th>
        <th class="col-act">📍 行程景點 / 活動</th>
        <th class="col-note">💡 備註</th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement('tbody');
  
  // 將每一個 30 分鐘時段對應到它所屬的「行程」，確保整排(時間+行程+備註)顏色100%同步！
  const eventMap = {};
  const slotToEvent = {};
  dayObj.events.forEach((ev, eventIndex) => {
    ev.bgClass = (eventIndex % 2 === 1) ? 'event-tinted' : 'event-white';
    eventMap[ev.start] = ev;
    for (let i = 0; i < ev.span; i++) {
      slotToEvent[ev.start + i] = {
        ev: ev,
        isLastSlotOfEvent: (i === ev.span - 1)
      };
    }
  });

  dayObj.slots.forEach((slotText, idx) => {
    const tr = document.createElement('tr');
    const slotInfo = slotToEvent[idx];
    const bgClass = slotInfo ? slotInfo.ev.bgClass : 'event-white';
    const timeBorderClass = (slotInfo && slotInfo.isLastSlotOfEvent) ? 'event-bottom-border' : 'time-inner-border';

    // 1. 時間欄 (與所屬行程完全同色，並在行程結束時畫實線、行程內部畫淡虛線)
    const tdTime = document.createElement('td');
    tdTime.className = `time-cell ${bgClass} ${timeBorderClass}`;
    tdTime.textContent = slotText;
    tr.appendChild(tdTime);

    // 2. 行程欄與備註欄 (當該行程開始時建立，並整排套用相同的 bgClass 與底部邊框)
    if (eventMap[idx]) {
      const ev = eventMap[idx];
      
      const tdAct = document.createElement('td');
      tdAct.className = `act-cell ${ev.bgClass} event-bottom-border`;
      if (ev.span > 1) tdAct.rowSpan = ev.span;
      tdAct.innerHTML = ev.title;
      tr.appendChild(tdAct);

      const tdNote = document.createElement('td');
      tdNote.className = `note-cell ${ev.bgClass} event-bottom-border`;
      if (ev.span > 1) tdNote.rowSpan = ev.span;
      if (ev.url) {
        let icon = '🚗 📍';
        if (ev.mode === 'walk') icon = '🚶 📍';
        if (ev.mode === 'transit') icon = '🚌 📍';
        tdNote.innerHTML = `<a class="map-link" href="${ev.url}" target="_blank" title="開啟 Google Maps 導航 (已鎖定當天該時段出發)">${icon}</a>`;
      }
      tr.appendChild(tdNote);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  page.appendChild(table);
  app.appendChild(page);
});
</script>
</body>
</html>
