  td.time-cell {

// 將沖繩當地時間 (JST, UTC+9) 轉換為精確的 Epoch 秒數
function getJstEpoch(year, month, day, hour, minute) {
  return Math.floor(Date.UTC(year, month - 1, day, hour - 9, minute, 0) / 1000);
}

// 產生帶有「指定當天該時段出發 (!6e0!7e2!8j...)」與「開車(!3e0) / 步行(!3e2) / 大眾運輸公車(!3e3)」的 Google Maps 路線網址
function makeMapUrl(orig, dest, month, day, hour, minute, mode = 'drive') {
  const epoch = getJstEpoch(2026, month, day, hour, minute);
  let modeParam = '!3e0'; // 預設開車
  if (mode === 'walk') modeParam = '!3e2';
  if (mode === 'transit') modeParam = '!3e3';
  return `https://www.google.com/maps/dir/${encodeURIComponent(orig)}/${encodeURIComponent(dest)}/data=!4m6!4m5!2m3!6e0!7e2!8j${epoch}${modeParam}`;
}

const app = document.getElementById('app');

daysData.forEach(dayObj => {
  const page = document.createElement('div');
  page.className = 'page';

  // Header
  const header = document.createElement('div');
  header.className = 'day-header';
  header.innerHTML = `
    <div class="day-badge">${dayObj.day}</div>
    <div class="day-title">${dayObj.title}</div>
  `;
  page.appendChild(header);

  // Table
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th class="col-time">⏰ 時間</th>
        <th class="col-act">📍 行程景點 / 活動</th>
        <th class="col-note">💡 備註</th>
      </tr>
    </thead>
  `;

  const tbody = document.createElement('tbody');
  
  // Map event start indices
  const eventMap = {};
  dayObj.events.forEach(ev => {
    eventMap[ev.start] = ev;
  });

  dayObj.slots.forEach((slotText, idx) => {
    const tr = document.createElement('tr');
    
    // 1. Time cell (every 30 mins)
    const tdTime = document.createElement('td');
    tdTime.className = 'time-cell';
    tdTime.textContent = slotText;
    tr.appendChild(tdTime);

    // 2. Check if an event starts at this slot
    if (eventMap[idx]) {
      const ev = eventMap[idx];
      
      // Activity Cell (Unified color and bold)
      const tdAct = document.createElement('td');
      tdAct.className = 'act-cell';
      if (ev.span > 1) tdAct.rowSpan = ev.span;
      tdAct.innerHTML = ev.title;
      tr.appendChild(tdAct);

      // Note / Google Maps Icon Hyperlink Cell (No capsule box, only icon link)
      const tdNote = document.createElement('td');
      tdNote.className = 'note-cell';
      if (ev.span > 1) tdNote.rowSpan = ev.span;
      if (ev.url) {
        let icon = '🚗 📍';
        if (ev.mode === 'walk') icon = '🚶 📍';
        if (ev.mode === 'transit') icon = '🚌 📍';
        tdNote.innerHTML = `<a class="map-link" href="${ev.url}" target="_blank" title="開啟 Google Maps 導航 (已鎖定當天該時段出發)">${icon}</a>`;
      }
      tr.appendChild(tdNote);
    }

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  page.appendChild(table);
  app.appendChild(page);
});
